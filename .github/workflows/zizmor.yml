# Static analysis of the GitHub Actions workflows themselves (zizmor). A
# workflow file is code that runs with this repository's own token, and it is
# the only code in the tree that none of the Go analysers reads, so it is
# audited by something that does.
#
# The gate runs zizmor's regular persona at --min-severity=low: it fails the
# build on any actionable (low/medium/high/critical) security finding -
# template-injection, cache-poisoning, dangerous-triggers, excessive-permissions,
# unpinned-uses, etc. - and uploads that same set to the code-scanning tab. The
# regular persona is the one zizmor documents for CI ("high-signal, low-noise,
# actionable"). The pedantic persona is deliberately NOT used to gate: it adds
# low-severity hygiene findings (undocumented permissions, missing concurrency,
# pin-comment mismatches, unnamed jobs) that are stylistic rather than
# security-blocking. Nothing collects those findings, so a pedantic run is a
# thing somebody does by hand and reads themselves.
#
# Rule for future workflow changes: every new or edited workflow must pass this
# gate before merge. Keep actions SHA-pinned, keep checkout on
# persist-credentials:false, and grant write permissions per job rather than at
# workflow level.
#
# The sentence above about unpinned-uses is a claim about the analyser rather
# than about this tree, and a gate that has never refused anything is a gate
# nobody has proved. The manual route below is how it is proved: it puts one
# tag reference into the checkout and the audit is expected to refuse the run.
# It is a dispatch rather than a branch because the triggers here are a push to
# the default branch and a pull request, so a branch does not run this gate and
# proving it that way would mean opening a pull request carrying a deliberate
# defect for somebody to clean up afterwards.
name: Workflow Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      unpin_one_action:
        description: "Replace one action's commit pin with the tag its own comment names. The run is expected to be refused."
        type: boolean
        default: false

# Explicit deny-all at workflow level; the job below grants only what it needs.
permissions: {}

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete scan. This is an audit job, not a publish, so
# cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF into the code-scanning tab
      contents: read # checkout the workflows to scan
    env:
      ZIZMOR_VERSION: "1.26.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Unpin one action
        # The defect this gate's pinning rule is against, and the mistake
        # somebody actually makes: a commit pin replaced by the version its own
        # trailing comment names, which reads as a tidy-up and turns a fixed
        # reference into a moving one. It exists only inside a run started by
        # hand with the input set, so nothing in the tree carries it and no
        # ordinary run sees it. The counts either side of the edit are what
        # keeps the proof honest: if the pin this step rewrites ever moves, the
        # substitution matches nothing, the audit passes, and a run that proved
        # nothing reads exactly like a gate that let a tag through.
        if: ${{ inputs.unpin_one_action }}
        run: |
          set -euo pipefail
          file=.github/workflows/dco.yml
          test "$(grep -cE 'uses: [^@]+@[0-9a-f]{40} # v' "$file")" -ge 1
          test "$(grep -cE 'uses: [^@]+@v[0-9]' "$file")" -eq 0
          sed -i -E '0,/uses: ([^@]+)@[0-9a-f]{40} # (v[0-9][^ ]*)/s//uses: \1@\2/' "$file"
          test "$(grep -cE 'uses: [^@]+@v[0-9]' "$file")" -eq 1
          grep -nE 'uses: [^@]+@v[0-9]' "$file"

      - name: Audit workflows (SARIF for code scanning)
        # --no-build: install zizmor from its prebuilt wheel only, never executing a
        # source-dist build script. --strict-collection: fail closed if any workflow
        # fails to parse, so a malformed/tampered file cannot slip past the audit.
        # --format=sarif always exits 0; the gate step below is what fails the build.
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        # Only upload where the GITHUB_TOKEN can write security events: pushes to main
        # and same-repo human PRs. Fork and Dependabot pull requests run with a
        # read-only token, so the upload is skipped there - the gate step below still
        # runs and blocks on findings. continue-on-error keeps the security gate
        # independent of the upload: a transient code-scanning upload failure must not
        # skip the "Fail on actionable findings" step below.
        #
        # A run started by hand matches neither arm, so the proof route does not
        # upload. That is the behaviour wanted rather than an accident of the
        # condition: its finding is about a line that exists for the length of
        # one run, and putting it in the dashboard would leave somebody to work
        # out later why an alert names a pin their checkout does not have.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail on actionable findings
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
