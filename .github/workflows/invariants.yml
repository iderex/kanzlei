# The invariants that are cheaper to read out of the syntax than to derive from
# the types.
#
# Each of the three rules this holds is one where a single wrong line silently
# removes a control. A route registered outside the routing table is an entry
# into this service that the table does not list, and the reader who goes
# looking for the surface finds the table and stops. A credential written into
# the source ships in every binary and survives every rotation. A case behind
# the needsreal constraint that never reaches its suite gate states no
# requirement, so it fails inside an assertion on a connection error instead of
# refusing with the missing thing named, and it appears in no roster either.
#
# None of the three is visible to a type checker and all three are visible in
# the syntax, which is why this is a lint over the tree rather than an analyser.
#
# The rules are in invariants.txt and not in this file or in the checker. That
# is the same arrangement import-rules.txt and .editorconfig already have here,
# and it is what makes adding an invariant a declaration rather than a change
# to a program. It holds for a shape one of the operators already expresses;
# the file refuses a shape none of them does, rather than passing over it.
#
# The decision is a program in this repository rather than a shell block, for
# the reason docs/decisions/0001-means.md gives. A grep over the tree would
# find the same lines and would also find them inside a comment, inside a
# string and inside this repository's own fixtures, and a rule with exceptions
# nobody can express is one people turn off.
name: invariants

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only. The check reports; there is no repair to write, because every one
# of these has more than one legal repair and the cheapest is usually the wrong
# one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    # The name published as the check. It is an interface: a protection rule
    # names a check as a string, so renaming this silently stops it being
    # required. #6 is where the published names are settled.
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the authority for the version. Naming one here would give
          # this repository two, and the second would drift.
          go-version-file: go.mod
          check-latest: false

      - name: The invariants this repository declares over its own source
        run: |
          set -euo pipefail
          # The same command CONTRIBUTING.md names, character for character. A
          # check reproduced by a different command is a different check, and
          # the one nobody runs locally is the one that goes red here for a
          # reason the contributor cannot see.
          go run ./cmd/invariants

      - name: The rules are read by their own fixtures, not only by the tree
        run: |
          set -euo pipefail
          # The step above is green whenever the tree happens to hold the
          # rules, which proves the state of the tree and not the guard. It is
          # green over a small subject here: one route in one package, no
          # credential anywhere, and a handful of constrained cases. These are
          # the cases that prove the operators bite, each written as the
          # mistake somebody actually makes rather than an obviously wrong one.
          go test ./internal/invariants ./cmd/invariants -count=1
