# Documentation references: every path a document names has to be there.
#
# Several issues in this plan have a sentence in a document as their
# done-condition, which makes a document load bearing. The way a load-bearing
# document fails is not that it becomes unreadable. It is that a file moves,
# the sentence pointing at it still reads correctly, and the next person
# follows it to a path that is not there. Nothing else in this tree catches
# that: the formatting gate judges bytes, the analysers judge Go, and neither
# reads a sentence.
#
# The decision is a program in this repository rather than a shell block, for
# the reason docs/decisions/0001-means.md gives. It parses markdown, resolves a
# path against a tree and a register of what is planned, and decides whether to
# refuse. internal/doclint holds the fixtures, including the near miss this is
# actually for: a record renamed in the tree and not in the sentence that
# points at it, one character apart.
#
# What it does not do is written where the rule is, in internal/doclint. The
# short version is that it reads two positions, an inline code span and a link
# target, and passes over command blocks, so it is a floor under the documents
# rather than a proof about them. #113 is where the rest of the documentation
# gate is argued.
#
# The second rule here is the shape a document is written in, in
# internal/mdlint. It is a separate rule from the one above because the two
# fail differently: a dead path is wrong on the day it is written, and a shape
# departure is wrong on the day another reader meets it. Three of its rules
# exist because the path check above is one of those readers, and an unclosed
# or mismatched fence moves the boundary it uses to tell prose from a command
# block, which turns it quiet rather than red.
#
# The third rule is the half of a link the first one cannot resolve, in
# internal/linkcheck. A target pointing inside this repository is a path and is
# read above; a target pointing off this machine belongs to somebody this
# repository has no relationship with, and it dies without anything here
# changing. That is the only rule in this file that leaves the runner, and what
# it refuses is held to the two answers that mean the address is not there.
#
# All three run under one published name. The name is what a protection rule
# holds the branch by, so a second check name here would be a second entry the
# required set has to be told about, for one gate that either passes or does
# not.
name: docs

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only. The check reports; there is no repair to write, because where a
# document names a path that is not there either the document is wrong or the
# path is missing and no tool can tell which.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # The name published as the check. It is an interface: a protection rule
    # names a check as a string, so renaming this silently stops it being
    # required. #6 is where the published names are settled.
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod is the authority for the version. Naming one here would give
          # this repository two, and the second would drift.
          go-version-file: go.mod
          check-latest: false

      - name: Every path this repository's documents name
        run: |
          set -euo pipefail
          # The same command CONTRIBUTING.md names, character for character. A
          # check reproduced by a different command is a different check, and
          # the one nobody runs locally is the one that goes red here for a
          # reason the contributor cannot see.
          go run ./cmd/doclint

      - name: The shape this repository's documents are written in
        run: |
          set -euo pipefail
          # The same command CONTRIBUTING.md names, character for character.
          go run ./cmd/mdlint

      - name: Every address this repository's documents point at off this machine
        run: |
          set -euo pipefail
          # The same command CONTRIBUTING.md names, character for character.
          #
          # This is the one step here that leaves the runner. It refuses only
          # the two answers that mean an address is not there, a 404 or a 410
          # and a host that does not resolve, and it prints without refusing
          # anything it could not judge. A gate that reddened because a host was
          # slow would be re-run until it was green, which is the same as having
          # no gate.
          go run ./cmd/linkcheck

      - name: The rules are read by their own fixtures, not only by the tree
        run: |
          set -euo pipefail
          # The steps above are green whenever the documents happen to be
          # correct, which proves the state of the tree and not the guard.
          # These are the cases that prove the guards, including the one
          # character that is the mistake somebody actually makes.
          #
          # It matters more for the link rule than for the other two, because
          # this repository's documents carry no external link at all today, so
          # that step is green over nothing and its fixtures are the only thing
          # standing behind it.
          go test ./internal/doclint ./cmd/doclint ./internal/mdlint ./cmd/mdlint ./internal/linkcheck ./cmd/linkcheck -count=1
